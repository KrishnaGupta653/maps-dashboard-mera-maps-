      'asia-south1-docker.pkg.dev/merapashu360-buyer-app/cloud-run-source-deploy/mera-maps', 
      '--build-arg',
      'NEXT_PUBLIC_MAPS_API_KEY=AIzaSyBAOwdI8Lfy-NRP-FDb5GObheVj-s7qkAI',
      '--build-arg',
      'GOOGLE_CLOUD_PROJECT=merapashu360-buyer-app',
      '--build-arg',
      'NEXT_PUBLIC_SUCHNAVALI_BASE_URL=https://suchnavali-65ukafezoa-el.a.run.app',
      '--build-arg',
      'NEXT_PUBLIC_MAP_ID=68b8f843e24917af',

      '.',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/merapashu360-buyer-app/cloud-run-source-deploy/mera-maps']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
